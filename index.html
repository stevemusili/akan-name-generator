<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com" rel= stylesheet>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">
        <h1>Akan Name Generator</h1>
        <p>Welcome to the Akan Name Generator! This is a simple tool that calculates the day of the week a user was born
            and assigns them an Akan name based on their gender.</p>
        <p>Enter your Birthdate to discover your Akan name!</p>
        <form id="nameform">
            <label>Day</label>
            <input type="number" id="day" min="1" max="31" required>

            <label>Month</label>
            <input type="number" id="month" min="1" max="12" required>

            <label>Year</label>
            <input type="number" id="year" required>

            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="male"> Male
                </label>
                <label>
                    <input type="radio" name="gender" value="female"> Female
                </label>
            </div>
            <button type="submit"> Generate Akan Name </button>
        </form>
        <h2 id="result"></h2>
    </div>
    <script src="/script.js"></script>

</body>

</html>
